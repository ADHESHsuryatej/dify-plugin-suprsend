identity:
  name: update_preference
  author: adheshsuryatej
  label:
    en_US: Update User Preference
description:
  human:
    en_US: Opt a user in or out of a notification category.
  llm: Sets one user's preference for a SuprSend notification category to opt_in or opt_out, optionally for a single tenant. Use this when a user subscribes to or unsubscribes from a type of notification. Safe to repeat.
parameters:
  - name: distinct_id
    type: string
    required: true
    form: llm
    label:
      en_US: User Distinct ID
    human_description:
      en_US: The unique ID of the user in your system.
    llm_description: Unique ID of the user.
  - name: category
    type: string
    required: true
    form: llm
    label:
      en_US: Category Slug
    human_description:
      en_US: In the SuprSend dashboard, open Notification Categories and copy the category slug, for example product-updates.
    llm_description: Slug of the notification category, for example product-updates.
  - name: preference
    type: select
    required: true
    default: opt_in
    form: llm
    label:
      en_US: Preference
    human_description:
      en_US: Opt the user in or out.
    llm_description: opt_in to subscribe the user, opt_out to unsubscribe.
    options:
      - value: opt_in
        label:
          en_US: Opt In
      - value: opt_out
        label:
          en_US: Opt Out
  - name: tenant_id
    type: string
    required: false
    form: form
    label:
      en_US: Tenant ID
    human_description:
      en_US: Set the preference for this tenant only.
extra:
  python:
    source: tools/update_preference.py
